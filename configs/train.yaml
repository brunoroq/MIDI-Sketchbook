# Stage 3 executable training configuration.
# Relative paths are resolved from the repository root, not from this file.
seed: 42
device: auto  # Supported: auto, cpu, or cuda.

paths:
  # Consume only sequences listed by the authoritative Stage 2 manifest.
  tokenization_manifest: data/tokenized/manifest.json
  checkpoints_dir: checkpoints
  tensorboard_log_dir: outputs/logs/training
  # Must be a schema-2 run's latest.pt inside checkpoints_dir when set.
  # Leave null to start from epoch 1; schema-1 checkpoints cannot be resumed.
  resume_from: null

model:
  architecture: gru
  embedding_dim: 64
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2

data:
  # The densest current conditioned 4-bar phrase is 452 tokens. Keep headroom
  # and reject anything above this bound rather than silently truncating it.
  max_sequence_length: 512
  batch_size: 4
  num_workers: 0

training:
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  # Supported: auto, on, or off. Auto enables it only on compatible CUDA.
  mixed_precision: auto
  checkpoint_every_epochs: 1
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0001
